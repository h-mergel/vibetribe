<!doctype html>
<html>
<head><style>:root{--ground:#0E1116;--track:#262C35;--line:#3A424E;--ink:#F3F5F8;--ink-muted:#A9B2BF;--ink-faint:#7A8494;--state-permission:#FFB524;--state-input:#E879C4;--state-error:#FF5C33;--state-done:#30D6A4;--state-throttled:#B4C8E8;--state-working:#3D8EF5;--state-background:#3D8EF5;--state-idle:#8D97A6;--state-offline:#7A8494;--level-neutral:#C3CDDA;--level-amber:#FFB524;--level-red:#FF5C33;--health-ok:#30D6A4;--health-stale:#FFB524;--health-missing:#FF5C33;--health-off:#7A8494;--on-accent:#0E1116;--font-sans:DejaVu Sans, "Segoe UI", Arial, sans-serif;--radius-frame-thick:14px;} body{margin:0}</style><link rel="stylesheet" href="bundle.css"><script src="bundle.js"></script><meta charset="utf-8"><title>Deck – Prototyp</title>
<style>
  .pt { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
  .dev { --k: 88px; --g: 18px; position: relative; padding: 64px calc(var(--k) * .54) 54px; border-radius: 34px;
         background: linear-gradient(180deg, #151618 0%, #0c0d0e 100%);
         box-shadow: 0 30px 60px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.05) inset, 0 -2px 0 rgba(0,0,0,.6) inset; }
  .dev-cap { position: absolute; top: 22px; left: 0; right: 0; text-align: center; font: 600 12px/16px var(--font-sans); letter-spacing: .18em; color: #5d6168; text-transform: uppercase; }
  .keys { display: grid; grid-template-columns: repeat(5, var(--k)); gap: var(--g); }
  .key { position: relative; width: var(--k); height: var(--k); border-radius: 18%; padding: 0; border: 0; cursor: pointer;
         background: #050506; box-shadow: 0 0 0 3px #1b1c1f, 0 0 0 5px #0a0a0b, 0 6px 10px rgba(0,0,0,.6), 0 2px 3px rgba(0,0,0,.8) inset;
         overflow: hidden; transition: transform .06s; }
  .key:active, .key.is-down { transform: translateY(1px) scale(.985); }
  .key:focus-visible { outline: 2px solid var(--ink); outline-offset: 6px; }
  .key .lcd { position: absolute; inset: 7%; border-radius: 12%; overflow: hidden; line-height: 0; background: #000; }
  .key .lcd svg { width: 100%; height: 100%; display: block; }
  .key::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
                background: linear-gradient(135deg, rgba(255,255,255,.075) 0%, rgba(255,255,255,0) 38%, rgba(255,255,255,0) 58%, rgba(255,255,255,.035) 70%, rgba(255,255,255,0) 82%); }
  .side { flex: 1 1 240px; min-width: 230px; max-width: 360px; font-family: var(--font-sans); }
  .side h3 { font-size: 13px; color: var(--ink); margin: 0 0 8px; }
  .side p { font-size: 12.5px; line-height: 18px; color: var(--ink-muted); margin: 0 0 12px; }
  .log { list-style: none; padding: 0; margin: 0; font-size: 12px; line-height: 17px; color: var(--ink-muted); max-height: 250px; overflow: auto; }
  .log li { padding: 4px 0; border-top: 1px solid var(--track); }
  .log b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
</style>
</head>
<body class="vt-page">
<div id="root"></div>
<script>
var V = window.VibeTribe, C = V.tokens.color, R = document.getElementById('root');
var variant = 'luftig';
function R_(m) { return V.render(m, { variant: variant }); }
function el(t, c, h) { var e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; }

/* ---------- neutral stand-ins for other keys (no brand marks) ---------- */
function stand(bg, inner, label) {
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144"><rect width="144" height="144" fill="' + bg + '"/>' + inner +
    (label ? '<text x="72" y="128" text-anchor="middle" font-family="' + V.tokens.font + '" font-size="18" fill="#ffffff">' + label + '</text>' : '') + '</svg>';
}
var W = '#ffffff', GREY = '#2B3038';
var ST = {
  apps: stand(GREY, '<path d="M38 44 H62 L70 52 H106 V92 H38 Z" fill="none" stroke="' + W + '" stroke-width="7"/>', 'Apps'),
  next: stand(GREY, '<path d="M58 40 L86 68 L58 96" fill="none" stroke="' + W + '" stroke-width="10"/>', 'Page 2'),
  back: stand(GREY, '<path d="M86 40 L58 68 L86 96" fill="none" stroke="' + W + '" stroke-width="10"/>', 'Page 1'),
  music: stand('#1F7A45', '<circle cx="72" cy="64" r="32" fill="none" stroke="' + W + '" stroke-width="7"/><path d="M62 50 L90 64 L62 78 Z" fill="' + W + '"/>', ''),
  prev: stand(GREY, '<path d="M96 46 L60 72 L96 98 Z M50 46 V98" fill="' + W + '" stroke="' + W + '" stroke-width="8"/>', ''),
  play: stand(GREY, '<path d="M56 44 L100 72 L56 100 Z" fill="' + W + '"/>', ''),
  nxt: stand(GREY, '<path d="M48 46 L84 72 L48 98 Z M94 46 V98" fill="' + W + '" stroke="' + W + '" stroke-width="8"/>', ''),
  mic: stand(GREY, '<rect x="58" y="34" width="28" height="48" rx="14" fill="' + W + '"/><path d="M46 70 A26 26 0 0 0 98 70 M72 96 V110" fill="none" stroke="' + W + '" stroke-width="7"/>', ''),
  blank: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144"><rect width="144" height="144" fill="#000"/></svg>'
};

/* ---------- simulation state ---------- */
var WAIT = { needs_permission: 1, needs_input: 1, error: 1, done_unseen: 1 };
var RANK = { needs_permission: 0, needs_input: 1, error: 2, done_unseen: 3 };
var TOOLS = ['Edit', 'Read', 'Bash', 'Grep', 'Subagent', 'Write'];
var sim, t0, paused = false, pausedAt = 0, page = 1, log = [], cycle = null, jump = {};
function now() { return ((paused ? pausedAt : Date.now()) - t0) / 1000; }
function reset() {
  t0 = Date.now(); pausedAt = t0; page = 1; cycle = null; jump = {}; log = [];
  sim = {
    slots: [
      { title: 'Mobile Entwicklung Northwind', badge: 'APP', state: 'working', tool: 0 },
      { title: 'Spec-Review VibeTribe', badge: 'APP', state: 'idle' },
      { title: 'Refactor hub', badge: 'WIN', state: 'working', tool: 2, bgCount: 2 },
      { title: 'Build Pipeline', badge: 'WSL', state: 'background', bgCount: 3 },
      { title: 'Notizen', badge: 'APP', state: 'idle' },
      { title: 'acme', badge: 'WSL', state: 'working', tool: 1 },
      { title: 'Remote Sandbox', badge: 'REM', state: 'no_signal' },
      null
    ],
    script: [
      [4, 0, { state: 'needs_permission' }, 'Slot 1 will eine Freigabe'],
      [9, 2, { state: 'done_unseen', bgCount: 2 }, 'Slot 3 ist fertig'],
      [14, 1, { state: 'needs_input' }, 'Slot 2 stellt eine Frage'],
      [21, 5, { state: 'error', detail: 'server_error' }, 'Slot 6 meldet einen Fehler'],
      [27, 7, { title: 'Datenmigration', badge: 'APP', state: 'working', tool: 3 }, 'Neue Session in Slot 8'],
      [36, 7, { state: 'throttled', detail: 'rate_limit' }, 'Slot 8 ist gedrosselt'],
      [52, 7, { state: 'working', detail: null, tool: 0 }, 'Slot 8 arbeitet wieder'],
      [66, 6, { state: 'idle' }, 'Remote-Session wieder erreichbar']
    ],
    done: 0
  };
  addLog('Start: 7 Sessions, Slot 8 frei');
  render();
}
function addLog(msg) { log.unshift([now(), msg]); drawLog(); }
function setState(i, patch) {
  var s = sim.slots[i] || {};
  for (var k in patch) s[k] = patch[k];
  if (patch.state) { s.since = now(); s.seen = false; if (!WAIT[patch.state]) { s.seen = true; } }
  sim.slots[i] = s;
}
function tick() {
  var t = now();
  while (sim.done < sim.script.length && sim.script[sim.done][0] <= t) {
    var ev = sim.script[sim.done++]; setState(ev[1], ev[2]); addLog(ev[3]);
  }
  render();
}

/* ---------- escalation rules (README: Rahmen, Eskalation, Atmen) ---------- */
var esc = {}, statusUntil = 0;
function updateEscalation() {
  esc = V.escalation(sim.slots.map(function (s, i) { return s ? { id: i, state: s.state, since: s.since, seen: s.seen } : null; }).filter(Boolean), now());
}
function slotModel(s, i, frameIdx) {
  if (!s) return { kind: 'empty' };
  var t = now(), m = { kind: 'slot', title: s.title, badge: s.badge, state: s.state, bgCount: s.bgCount, detail: s.detail };
  if (s.state === 'working') { m.detail = TOOLS[(s.tool + Math.floor(t / 5)) % TOOLS.length]; m.tick = Math.floor(t / 2) % 3; }
  if (WAIT[s.state]) m.wait = t - s.since;
  if (s.state === 'needs_permission' || s.state === 'needs_input' || s.state === 'error') m.frame = s.seen ? 'thin' : 'thick';
  if (s.state === 'needs_permission' || s.state === 'needs_input') {
    var ph = esc[i];
    if (ph === 'A' || ph === 'C') m.level = V.breathLevel(frameIdx);
  }
  if (jump[i] && jump[i] > Date.now()) m.jumping = true;
  return m;
}
function waitingList() {
  return sim.slots.map(function (s, i) { return s && WAIT[s.state] && !(s.seen && s.state !== 'error' && s.state !== 'needs_permission' && s.state !== 'needs_input') ? { i: i, s: s } : null; })
    .filter(Boolean).sort(function (a, b) { return RANK[a.s.state] - RANK[b.s.state] || a.s.since - b.s.since; });
}
function inboxModel() {
  var w = waitingList();
  if (cycle && cycle.until > Date.now() && w.length > 1) {
    var cur = w[Math.min(cycle.index, w.length) - 1];
    return { kind: 'inbox', waiting: w.length, cycle: { index: Math.min(cycle.index, w.length), total: w.length }, top: { title: cur.s.title, state: cur.s.state, wait: now() - cur.s.since } };
  }
  return { kind: 'inbox', waiting: w.length, top: w.length ? { title: w[0].s.title, state: w[0].s.state, wait: now() - w[0].s.since } : null };
}
function limitModel(label) {
  var t = now();
  if (label === '5h') { var u = Math.min(99, 34 + t / 6); var p = 40 + t / 12; return { kind: 'limit', label: '5h', usedPct: u, pacePct: p, resetIn: '2h 15m', level: u >= 85 ? 'red' : u >= 60 ? 'amber' : 'neutral', ahead: u - p > 10 }; }
  return { kind: 'limit', label: 'Week', usedPct: 72, pacePct: 55, resetIn: '3d 4h', level: 'amber', ahead: true };
}

/* ---------- layout ---------- */
function page1(frameIdx) {
  var s = sim.slots; updateEscalation();
  return [
    ['apps', ST.apps], ['lim5', R_(limitModel('5h'))], ['limW', R_(limitModel('Week'))], ['inbox', R_(inboxModel())],
    ['status', R_({ kind: 'status', expanded: statusUntil > Date.now(), rows: [{ source: 'WIN', health: 'ok' }, { source: 'WSL', health: 'ok' }, { source: 'REM', health: s[6] && s[6].state === 'no_signal' ? 'stale' : 'ok' }, { source: 'LIM', health: 'ok' }] })],
    ['extra', R_({ kind: 'extra', used: '€12.40', limit: '€50.00', ratio: 0.248, level: 'neutral' })],
    ['s0', R_(slotModel(s[0], 0, frameIdx))], ['s1', R_(slotModel(s[1], 1, frameIdx))], ['s2', R_(slotModel(s[2], 2, frameIdx))], ['s3', R_(slotModel(s[3], 3, frameIdx))],
    ['next', ST.next],
    ['s4', R_(slotModel(s[4], 4, frameIdx))], ['s5', R_(slotModel(s[5], 5, frameIdx))], ['s6', R_(slotModel(s[6], 6, frameIdx))], ['s7', R_(slotModel(s[7], 7, frameIdx))]
  ];
}
function page2() {
  return [['back', ST.back], ['music', ST.music], ['b', ST.blank], ['b', ST.blank], ['b', ST.blank],
          ['b', ST.blank], ['prev', ST.prev], ['play', ST.play], ['nxt', ST.nxt], ['mic', ST.mic],
          ['b', ST.blank], ['b', ST.blank], ['b', ST.blank], ['b', ST.blank], ['b', ST.blank]];
}

/* ---------- DOM ---------- */
var wrap = el('div', 'pt'), dev = el('div', 'dev'), keysEl = el('div', 'keys'), side = el('div', 'side');
dev.appendChild(el('div', 'dev-cap', 'MK.2 · 15 Tasten')); dev.appendChild(keysEl); wrap.appendChild(dev); wrap.appendChild(side); R.appendChild(wrap);
var keyEls = [], last = [];
for (var k = 0; k < 15; k++) {
  var b = el('button', 'key'); b.type = 'button'; b.dataset.idx = k;
  var lcd = el('div', 'lcd'); b.appendChild(lcd); keysEl.appendChild(b); keyEls.push(b); last.push('');
  (function (btn) {
    var downAt = 0, timer = null;
    btn.addEventListener('pointerdown', function () { downAt = Date.now(); btn.classList.add('is-down'); timer = setTimeout(function () { timer = null; press(+btn.dataset.idx, true); }, 600); });
    btn.addEventListener('pointerup', function () { btn.classList.remove('is-down'); if (timer) { clearTimeout(timer); timer = null; press(+btn.dataset.idx, false); } });
    btn.addEventListener('pointerleave', function () { btn.classList.remove('is-down'); if (timer) { clearTimeout(timer); timer = null; } });
    btn.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); press(+btn.dataset.idx, e.shiftKey); } });
  })(b);
}
var current = [];
var LABELS = { apps: 'Apps-Ordner', lim5: '5-Stunden-Limit', limW: 'Wochenlimit', inbox: 'Inbox', status: 'Quellenstatus', extra: 'Extra Usage', next: 'Seite 2', back: 'Seite 1', music: 'Musik-App', prev: 'Zurück', play: 'Wiedergabe', nxt: 'Weiter', mic: 'Mikrofon', b: 'Leere Taste' };
function slotLabel(i) { var s = sim.slots[i]; return 'Slot ' + (i + 1) + (s ? ': ' + V.states[s.state].word + ', ' + s.title : ': frei'); }
function render() {
  var frameIdx = Math.floor((Date.now() - t0) / 250);
  current = page === 1 ? page1(frameIdx) : page2();
  current.forEach(function (c) { if (/^s\d$/.test(c[0])) c[2] = slotLabel(+c[0][1]); });
  current.forEach(function (c, i) {
    if (last[i] !== c[1]) { keyEls[i].firstChild.innerHTML = c[1]; last[i] = c[1]; }
    keyEls[i].setAttribute('aria-label', c[2] || LABELS[c[0]] || 'Leere Taste');
  });
}
function markSeen(i, how) {
  var s = sim.slots[i]; if (!s) return;
  jump[i] = Date.now() + 1200;
  if (s.state === 'done_unseen') { setState(i, { state: 'idle', bgCount: s.bgCount }); addLog('Slot ' + (i + 1) + ' angesehen, jetzt bereit'); return; }
  if (WAIT[s.state] && !s.seen) { s.seen = true; addLog('Slot ' + (i + 1) + ' gesehen (' + how + ')'); }
  else addLog('Sprung zu Slot ' + (i + 1));
}
function press(idx, long) {
  var id = current[idx] && current[idx][0];
  if (id === 'next') { page = 2; addLog('Seite 2'); }
  else if (id === 'back') { page = 1; addLog('Seite 1'); }
  else if (id && id[0] === 's' && id.length === 2) {
    var i = +id[1];
    if (long && sim.slots[i] && (sim.slots[i].state === 'needs_permission' || sim.slots[i].state === 'needs_input')) { setState(i, { state: 'working', tool: 0 }); addLog('Slot ' + (i + 1) + ' beantwortet, arbeitet weiter'); }
    else markSeen(i, 'Sprung');
  }
  else if (id === 'status') {
    if (long) addLog('Status gehalten: öffnet Einrichtung/Diagnose');
    else { statusUntil = Date.now() + 5000; addLog('Status: alle Quellen für 5 s'); }
  }
  else if (id === 'inbox') {
    var w = waitingList();
    if (long) {
      var n = 0; sim.slots.forEach(function (s, i) { if (s && s.state === 'done_unseen') { setState(i, { state: 'idle' }); n++; } });
      addLog(n ? n + ' fertige Session(s) quittiert' : 'Nichts zu quittieren');
    } else if (w.length) {
      if (cycle && cycle.until > Date.now()) cycle.index = cycle.index % w.length + 1; else cycle = { index: 1 };
      cycle.until = Date.now() + 5000;
      var target = w[Math.min(cycle.index, w.length) - 1];
      markSeen(target.i, 'Inbox ' + cycle.index + '/' + w.length);
    } else addLog('Inbox leer');
  }
  render();
}

/* ---------- side panel ---------- */
side.appendChild(el('h3', '', 'So bedienst du den Prototyp'));
side.appendChild(el('p', '', 'Tippen = zur Session springen (Wartezustand gilt als gesehen). Halten auf Freigabe/Frage = beantwortet. Inbox tippen = dringendste, erneut tippen innerhalb 5 s = nächste. Inbox halten = alle Fertigen quittieren. Status tippen = alle Quellen für 5 s. „Seite 2“ zeigt Musik und Mikro. Tastatur: Tab zur Taste, Enter tippt, Shift+Enter hält.'));
var bar = el('div', 'row');
function btn(label, fn) { var b = el('button', 'vt-btn', label); b.type = 'button'; b.onclick = fn; bar.appendChild(b); return b; }
var pb = btn('Pause', function () { if (paused) { t0 += Date.now() - pausedAt; paused = false; pb.textContent = 'Pause'; } else { pausedAt = Date.now(); paused = true; pb.textContent = 'Weiter'; } });
btn('Neu starten', function () { paused = false; pb.textContent = 'Pause'; reset(); });
var vb = btn('Variante: luftig', function () { variant = variant === 'luftig' ? 'dicht' : 'luftig'; vb.textContent = 'Variante: ' + variant; last = last.map(function () { return ''; }); render(); });
var sizes = [['Groß', 88, 18], ['Gerätegröße', 72, 14]], si = 0;
var sb = btn('Gerätegröße', function () { si = 1 - si; dev.style.setProperty('--k', sizes[si][1] + 'px'); dev.style.setProperty('--g', sizes[si][2] + 'px'); sb.textContent = sizes[1 - si][0]; });
side.appendChild(bar);
var vbar = el('div', 'row'), views = [['Normal', ''], ['Deuteranopie', 'url(#vt-deut)'], ['Graustufen', 'grayscale(1)'], ['LCD gedimmt', 'brightness(.45)'], ['Tageslicht', 'contrast(.55) brightness(1.25)']];
views.forEach(function (v, i) {
  var b = el('button', 'vt-btn', v[0]); b.type = 'button'; b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
  b.onclick = function () { [].forEach.call(vbar.children, function (x) { x.setAttribute('aria-pressed', 'false'); }); b.setAttribute('aria-pressed', 'true'); keysEl.style.filter = v[1]; };
  vbar.appendChild(b);
});
side.appendChild(vbar);
document.body.insertAdjacentHTML('beforeend', '<svg width="0" height="0" style="position:absolute"><filter id="vt-deut"><feColorMatrix type="matrix" values="0.367 0.861 -0.228 0 0  0.280 0.673 0.047 0 0  -0.012 0.043 0.969 0 0  0 0 0 1 0"/></filter></svg>');
side.appendChild(el('h3', '', 'Ereignisse'));
var logEl = el('ul', 'log'); side.appendChild(logEl);
function drawLog() {
  logEl.innerHTML = '';
  log.slice(0, 30).forEach(function (l) { var s = Math.floor(l[0]); var li = el('li', '', '<b>' + Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2) + '</b>'); li.appendChild(document.createTextNode(l[1])); logEl.appendChild(li); });
}

reset();
setInterval(function () { if (!paused) tick(); }, 250);
</script>
</body>
</html>
